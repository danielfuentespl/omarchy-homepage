name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Qt QML test runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick-window
          test -x /usr/lib/qt6/bin/qmltestrunner
      - name: Run checks (require loopback integrations)
        env:
          OMA_HOMEPAGE_REQUIRE_INTEGRATION: "1"
        run: ./tests/run
